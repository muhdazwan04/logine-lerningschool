const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('elearn_files',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const fput=async(id,b)=>{const d=await idb();return new Promise((r,j)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(b,id);t.oncomplete=r;t.onerror=t.onabort=()=>j(t.error)})};
const fget=async id=>{const d=await idb();return new Promise((r,j)=>{const q=d.transaction('f').objectStore('f').get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})};
async function gc(){try{const d=await idb(),x=load(),used=new Set([...x.books,...x.notes,...x.bukti,...x.latihan,...x.hantaran,...x.messages.filter(m=>m.media).map(m=>({file_ref:m.media.ref}))].map(r=>r.file_ref).filter(Boolean));
 const ks=await new Promise(r=>{const q=d.transaction('f').objectStore('f').getAllKeys();q.onsuccess=()=>r(q.result)});
 const t=d.transaction('f','readwrite');ks.filter(k=>!used.has(k)&&Date.now()-parseInt(k.slice(1,14))>60000).forEach(k=>t.objectStore('f').delete(k))}catch{}}
async function openB(t,i){const r=db[t].find(x=>x.id==i);
 if(r.file_ref){const w=window.open('','_blank');try{const b=await fget(r.file_ref);if(!b)throw 0;w.location=URL.createObjectURL(b)}catch{w.close();toast('Fail tidak dijumpai di pelayar ini','err')}return}
 let u=r.file_url;if(!u)return;
 if(u.startsWith('data:')){const[a,b]=u.split(','),s=atob(b),n=new Uint8Array(s.length);for(let k=0;k<s.length;k++)n[k]=s.charCodeAt(k);u=URL.createObjectURL(new Blob([n],{type:a.slice(5,a.indexOf(';'))}))}
 else if(!/^https?:\/\//i.test(u))u='https://'+u;
 window.open(u,'_blank','noopener')}

 try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),mr=new MediaRecorder(st),ch=[];REC={mr,t0:Date.now(),send:false};
  mr.ondataavailable=ev=>ev.data.size&&ch.push(ev.data);
  mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());const r=REC;REC=null;if(r){clearInterval(r.iv)}const f=$('#sf');f&&f.classList.remove('rec');if(!r||!r.send||!ch.length)return;
   const bl=new Blob(ch,{type:mr.mimeType||'audio/webm'}),id='f'+Date.now()+Math.random().toString(36).slice(2,6);try{await fput(id,bl)}catch{return toast('Gagal simpan suara','err')}post({media:{ref:id,type:'audio',name:'voice'}})};
  mr.start();$('#sf').classList.add('rec');REC.iv=setInterval(()=>{const s=Math.floor((Date.now()-REC.t0)/1000),t=$('#rt');if(t)t.textContent='🔴 '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},500)}
 catch{toast('Mikrofon tidak dibenarkan / tidak dijumpai (perlu https atau localhost)','err')}}
const recStop=s=>{if(REC){REC.send=!!s;REC.mr.stop()}};

 document.body.className=u.role;if(!S.page||!can(S.page)){S.page=home(u);S.arg=null}

 cu();if(S.page=='chat'){paint();ecat();T=setInterval(()=>{db=load();paint()},2000)}
 if(S.page=='qz'){tick();T=setInterval(tick,1000)}}
